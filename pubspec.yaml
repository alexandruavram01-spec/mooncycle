name: mooncycle
description: MoonCycle - period, symptom and hormone tracking with partner sharing.
publish_to: "none"
version: 1.0.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"
  # Radio groups, text size and the packages below need a recent Flutter;
  # the lock file already requires 3.47. Codemagic builds on latest stable.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Romanian buttons, date pickers and dialogs from Flutter itself.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.5
  # Desktop-only SQLite backend. Android uses the platform implementation;
  # this exists so the app can be run on Windows for fast UI iteration.
  # Brings its own SQLite library (package:sqlite3 3.x); the old
  # sqlite3_flutter_libs is no longer needed.
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.0
  # flutter_localizations needs 0.20.
  intl: ^0.20.3
  shared_preferences: ^2.2.3
  http: ^1.2.0
  # Fredoka for headings, Nunito for all other text (lib/ui/theme.dart), and
  # Gelasio for the MoonCycle wordmark. Kept on 8.x: 9.0 brings its own copy
  # of Flutter's Material library (material_ui), whose TextTheme does not fit
  # the app's ThemeData.
  google_fonts: ^8.2.0
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  # The phone's time zone, so reminders fire at 9:00 local time rather than
  # 9:00 UTC (lib/services/notification_service.dart).
  flutter_timezone: ^5.1.1
  # Opens the NHS source links on her insight cards, and the phone's dialler
  # from "Get help now".
  url_launcher: ^6.3.1
  # The phone's fingerprint, face or PIN, to confirm deleting the account.
  # Needs an AppCompat theme on Android (res/values*/styles.xml).
  local_auth: ^3.0.2
  # "Continue with Google" on Android (lib/services/google_account.dart).
  # The clients are in Google Cloud, project MoonCycle: SIGN_IN_SETUP.md.
  google_sign_in: ^7.2.0
  # Sign in with Apple on iPhone (lib/services/apple_account.dart). Needs the
  # capability on the App ID and ios/Runner/Runner.entitlements.
  sign_in_with_apple: ^8.2.0
  # The phone's share menu: "Export my data", and his invitation to her
  # ("Send invitation", lib/ui/widgets/partner_invite.dart).
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Makes every app icon size from assets/icon/: run
  # `dart run flutter_launcher_icons` after changing those images.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # The logo's artwork (moon and couple), transparent, for the app's own
    # screens. Made from the full logo; see assets/icon/ for the app icon.
    - assets/brand/logo_mark.png

# All made by tool/app_icon.ps1 from assets/icon/source/icon_art.webp.
# icon.png: 1024 x 1024, square edges, no transparency, no text.
# icon_background.png: Android's shaped icon, the artwork within the middle
# two thirds on its own purple; icon_foreground.png is left empty.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFF7F2"
    theme_color: "#FFF7F2"

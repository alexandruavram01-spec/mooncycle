name: mooncycle
description: MoonCycle - period, symptom and hormone tracking with partner sharing.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  # Desktop-only SQLite backend. Android uses the platform implementation;
  # this exists so the app can be run on Windows for fast UI iteration.
  sqflite_common_ffi: ^2.3.3
  # Bundles the native sqlite3 library. Without it the FFI backend has nothing
  # to load on Windows and fails at startup.
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.0
  # Gelasio, a free serif with Georgia's proportions, for the wordmark and
  # the quiz headings.
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  # Opens the NHS source links on her insight cards, and the phone's dialler
  # from "Get help now".
  url_launcher: ^6.3.1
  # The phone's fingerprint, face or PIN, to confirm deleting the account.
  # Needs an AppCompat theme on Android (res/values*/styles.xml).
  local_auth: ^3.0.2
  # "Continue with Google" on Android (lib/services/google_account.dart).
  # The clients are in Google Cloud, project MoonCycle: SIGN_IN_SETUP.md.
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Makes every app icon size from assets/icon/: run
  # `dart run flutter_launcher_icons` after changing those images.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # The logo's artwork (moon and couple), transparent, for the app's own
    # screens. Made from the full logo; see assets/icon/ for the app icon.
    - assets/brand/logo_mark.png

# icon.png: 1024 x 1024, square edges, no transparency, no text.
# icon_foreground.png: the artwork alone on a transparent background, kept
# inside the middle two thirds, for Android's shaped icons.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#FAEDE3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFF7F2"
    theme_color: "#FFF7F2"

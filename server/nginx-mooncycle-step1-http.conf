# Step 1 for mooncycle.fit: plain HTTP only, so Let's Encrypt can reach the
# challenge folder. Replaced by nginx-mooncycle-step2-https.conf once the
# certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name mooncycle.fit www.mooncycle.fit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

# mooncycle.fit — the MoonCycle website and its API.

server {
    listen 80;
    listen [::]:80;
    server_name mooncycle.fit www.mooncycle.fit;

    # Certificate renewals answer here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mooncycle.fit$request_uri;
    }
}

# www goes to the bare domain. A browser keeps separate storage per address,
# so serving both would give one person two copies of her logs.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mooncycle.fit;

    ssl_certificate     /etc/letsencrypt/live/mooncycle.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mooncycle.fit/privkey.pem;

    return 301 https://mooncycle.fit$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mooncycle.fit;

    ssl_certificate     /etc/letsencrypt/live/mooncycle.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mooncycle.fit/privkey.pem;

    root /var/www/mooncycle;
    index index.html;

    # Still a test build: keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    # /api/ is passed to the API service.
    include snippets/mooncycle-api.conf;

    # Flutter web routes in the browser, so unknown paths fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # These three control which build a browser runs and must not be cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 512;
}

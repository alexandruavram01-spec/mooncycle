# Every push to main is checked, built and deployed to the server, so the
# PC never uploads anything by hand. One-time setup and how it works:
# DEPLOY.md.
name: Check and deploy

on:
  push:
    branches: [main]
  # "Run workflow" on the Actions tab redeploys without a new commit.
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with the PC (flutter --version).
  FLUTTER_VERSION: '3.47.8'

jobs:
  deploy:
    name: Check, build and deploy
    # A fixed image, so GitHub moving "ubuntu-latest" on cannot break a deploy.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # Errors and warnings stop the deploy; style hints do not.
      - name: Analyse
        run: flutter analyze --no-fatal-infos

      # The widget tests predate sign-in and are not run until updated.
      - name: Unit tests
        run: flutter test test/cycle_engine_test.dart test/partner_test.dart test/her_insights_test.dart test/her_insights_ro_json_test.dart test/her_chat_test.dart

      - name: Check the API code
        run: |
          node --check server/server.js
          node --check server/her-notes.js
          node --check server/her-chat.js
          # Loads the chat with the card texts, as on the server.
          cp content/her-insights-en-GB-combined.json server/her-cards.json
          cp content/her-insights-ro.json server/her-cards-ro.json
          node -e "const chat = require('./server/her-chat.js'); if (!chat.REFERENCE.ro) throw new Error('no Romanian cards')"
          node -e "JSON.parse(require('fs').readFileSync('content/her-insights-en-GB-combined.json', 'utf8'))"

      - name: Build the website
        run: flutter build web --release

      # The key comes from the repository's secrets and is never printed.
      # The server's public key is in .github/known_hosts: it is public, and
      # a server whose key does not match is refused. Ends with a test login,
      # so a setup problem shows up here with a plain message.
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is missing. See DEPLOY.md, part D."
              exit 1
            fi
          done

          install -m 700 -d ~/.ssh
          # The key may be pasted as one base64 line (DEPLOY.md, part D),
          # which survives copy and paste exactly, or as the key file's
          # text. Text pasted on Windows can carry carriage returns, which
          # SSH rejects.
          raw="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')"
          if printf '%s' "$raw" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            # The key file's text: drop stray spaces and blank lines.
            printf '%s\n' "$raw" \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' \
              > ~/.ssh/deploy
            format="the key file's text"
          else
            printf '%s' "$raw" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy 2>/dev/null || true
            format="one line"
          fi
          chmod 600 ~/.ssh/deploy
          tr -d '\r' < .github/known_hosts > ~/.ssh/known_hosts
          echo "HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          # Says what is wrong with the key without printing any of it.
          if ! problem="$(ssh-keygen -y -P '' -f ~/.ssh/deploy 2>&1 >/dev/null)"; then
            if printf '%s' "$problem" | grep -qi passphrase; then
              hint="The key has a passphrase, which GitHub cannot type. Remove it: DEPLOY.md, part D."
            elif head -n1 ~/.ssh/deploy | grep -q '^ssh-'; then
              hint="This is the public key (the .pub file). Use the private key file: DEPLOY.md, part D."
            elif head -n1 ~/.ssh/deploy | grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$'; then
              hint="The key looks cut short or changed. Copy it again as one line: DEPLOY.md, part D."
            else
              hint="The secret does not look like a private key. As one line it should start with LS0tLS1CRUdJTi and be about 540 characters long: DEPLOY.md, part D."
            fi
            # Size and shape only, never content.
            echo "The secret has ${#raw} characters on $(printf '%s\n' "$raw" | wc -l) line(s) and was read as $format."
            echo "::error::DEPLOY_SSH_KEY cannot be used. $hint"
            exit 1
          fi
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          if ! ssh-keygen -F "$host" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::.github/known_hosts has no line for the server in DEPLOY_HOST: DEPLOY.md, part D."
            exit 1
          fi
          if ! ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 \
              "deploy@$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')" true; then
            echo "::error::Could not log in to the server as deploy. Check DEPLOY.md parts B to D: 'Host key verification failed' means .github/known_hosts does not match the server; 'Permission denied' means the key on the server."
            exit 1
          fi

      # The API first: the new website may rely on what it adds.
      - name: Deploy the API
        run: |
          # The reviewed card texts the AI notes and chat are written from.
          cp content/her-insights-en-GB-combined.json server/her-cards.json
          # The same cards in Romanian (tool/export_ro_cards.py).
          cp content/her-insights-ro.json server/her-cards-ro.json
          rsync -rlz --chmod=D755,F644 -e "ssh -i $HOME/.ssh/deploy -o BatchMode=yes" \
            server/server.js server/her-notes.js server/her-chat.js server/sample-notes.js server/sample-chat.js \
            server/her-cards.json server/her-cards-ro.json \
            "deploy@$HOST:/opt/mooncycle-api/"
          ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@$HOST" \
            'sudo systemctl restart mooncycle-api && sleep 2 && systemctl is-active mooncycle-api'

      - name: Deploy the website
        run: |
          rsync -rlz --chmod=D755,F644 -e "ssh -i $HOME/.ssh/deploy -o BatchMode=yes" \
            build/web/ "deploy@$HOST:/var/www/mooncycle/"

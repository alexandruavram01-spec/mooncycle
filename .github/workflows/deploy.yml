# Every push to main is checked, built and deployed to the server, so the
# PC never uploads anything by hand. One-time setup and how it works:
# DEPLOY.md.
name: Check and deploy

on:
  push:
    branches: [main]
  # "Run workflow" on the Actions tab redeploys without a new commit.
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with the PC (flutter --version).
  FLUTTER_VERSION: '3.47.7'

jobs:
  deploy:
    name: Check, build and deploy
    # A fixed image, so GitHub moving "ubuntu-latest" on cannot break a deploy.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # Errors and warnings stop the deploy; style hints do not.
      - name: Analyse
        run: flutter analyze --no-fatal-infos

      # The widget tests predate sign-in and are not run until updated.
      - name: Unit tests
        run: flutter test test/cycle_engine_test.dart test/partner_test.dart

      - name: Check the API code
        run: |
          node --check server/server.js
          node --check server/tip-writer.js

      - name: Build the website
        run: flutter build web --release

      # The key and the server's fingerprint come from the repository's
      # secrets and are never printed. Ends with a test login, so a setup
      # problem shows up here with a plain message.
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is missing. See DEPLOY.md, part D."
              exit 1
            fi
          done

          install -m 700 -d ~/.ssh
          # Text pasted on Windows can carry carriage returns, which SSH
          # rejects in a key file.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          echo "HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key. Copy it again (DEPLOY.md, part D)."
            exit 1
          fi
          if ! ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 \
              "deploy@$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')" true; then
            echo "::error::Could not log in to the server as deploy. Check DEPLOY.md parts B to D: 'Host key verification failed' means DEPLOY_KNOWN_HOSTS; 'Permission denied' means the key on the server."
            exit 1
          fi

      # The API first: the new website may rely on what it adds.
      - name: Deploy the API
        run: |
          rsync -rlz --chmod=D755,F644 -e "ssh -i $HOME/.ssh/deploy -o BatchMode=yes" \
            server/server.js server/tip-writer.js server/tips-seed.json \
            "deploy@$HOST:/opt/mooncycle-api/"
          ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@$HOST" \
            'sudo systemctl restart mooncycle-api && sleep 2 && systemctl is-active mooncycle-api'

      - name: Deploy the website
        run: |
          rsync -rlz --chmod=D755,F644 -e "ssh -i $HOME/.ssh/deploy -o BatchMode=yes" \
            build/web/ "deploy@$HOST:/var/www/mooncycle/"
